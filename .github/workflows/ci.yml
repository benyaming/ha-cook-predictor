name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --group test --group lint
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: uv run pytest

  # The newest Home Assistant the test harness supports, whatever pyproject pins: the weekly
  # run catches a Home Assistant release that breaks the integration before users do.
  tests-latest-ha:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv
      - run: uv pip install pytest-homeassistant-custom-component
      - run: uv run --no-sync python -c "import homeassistant.const as c; print(c.__version__)"
      - run: uv run --no-sync pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images ship inside the integration (HA 2026.3+), not in home-assistant/brands.
          ignore: brands
