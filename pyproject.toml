[project]
name = "ha-cook-predictor"
version = "0.1.0"
description = "Home Assistant integration that predicts when a cook will be done from any temperature probes, and keeps a journal of every cook"
requires-python = ">=3.14.2"
readme = "README.md"
license = "MIT"

[dependency-groups]
# Pinned to the Home Assistant release the integration is tested against.
test = [
    "pytest-homeassistant-custom-component==0.13.375",
]
lint = [
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TRY"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "RUF012",  # Home Assistant's _attr_* class attributes
    "TRY003",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
